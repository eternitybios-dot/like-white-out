<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>白嶺のマタギ ─ 雪山サバイバル防衛</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-time="day">

<div id="snow" aria-hidden="true"></div>
<div id="blizzard" aria-hidden="true"></div>
<div id="nightTint" aria-hidden="true"></div>

<div id="app">

  <!-- ヘッダー -->
  <header id="topbar">
    <div class="top-row">
      <div id="dayInfo" class="day-info">第1日</div>
      <div id="timeInfo" class="time-info">☀ 昼</div>
      <div id="weatherInfo" class="weather-info">晴雪</div>
      <button id="soundToggle" class="sound-toggle" aria-label="音を鳴らす">🔇</button>
    </div>
    <div id="threatBanner" class="threat-banner">
      <span id="threatIcon">🐾</span>
      <span id="threatText">ヒグマの気配：痕跡のみ</span>
    </div>
  </header>

  <!-- 資源バー -->
  <div id="resbar">
    <div class="res" title="薪"><span class="res-icon">🪵</span><span id="res-wood">0</span></div>
    <div class="res" title="食料"><span class="res-icon">🍙</span><span id="res-food">0</span></div>
    <div class="res" title="薬草"><span class="res-icon">🌿</span><span id="res-herb">0</span></div>
    <div class="res" title="毛皮"><span class="res-icon">🟤</span><span id="res-fur">0</span></div>
    <div class="res" title="鉄くず"><span class="res-icon">⚙️</span><span id="res-iron">0</span></div>
  </div>

  <!-- メイン -->
  <main id="screens">
    <section id="screen-village" class="screen active"></section>
    <section id="screen-build" class="screen"></section>
    <section id="screen-jobs" class="screen"></section>
    <section id="screen-explore" class="screen"></section>
    <section id="screen-log" class="screen"></section>
  </main>

  <!-- チュートリアルヒント -->
  <div id="hintBar" class="hint-bar hidden">
    <span id="hintText"></span>
    <button id="hintClose" aria-label="閉じる">✕</button>
  </div>

  <!-- 夜を迎えるボタン -->
  <div id="endDayWrap">
    <button id="endDayBtn" class="end-day-btn">🌙 夜を迎える</button>
  </div>

  <!-- タブバー -->
  <nav id="tabbar">
    <button class="tab active" data-tab="village"><span class="tab-icon">🏔</span><span class="tab-label">村</span></button>
    <button class="tab" data-tab="build"><span class="tab-icon">🏚</span><span class="tab-label">施設</span></button>
    <button class="tab" data-tab="jobs"><span class="tab-icon">👥</span><span class="tab-label">配置</span></button>
    <button class="tab" data-tab="explore"><span class="tab-icon">🌲</span><span class="tab-label">探索</span></button>
    <button class="tab" data-tab="log"><span class="tab-icon">📜</span><span class="tab-label">記録</span></button>
  </nav>

</div>

<!-- オーバーレイ（夜イベント・モーダル） -->
<div id="overlay" class="overlay hidden">
  <div id="overlayCard" class="overlay-card"></div>
</div>

<script src="script.js"></script>
</body>
</html>
